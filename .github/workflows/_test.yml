on:
  workflow_call:
    inputs:
      engine_ref:
        description: "Engine git ref to checkout (defaults to triggering ref)"
        type: string
      fizzy_ref:
        description: "Fizzy git ref for cloning during tests"
        type: string
        required: true
      fizzy_image_tag:
        description: "Docker image tag for the Fizzy base image"
        type: string
        required: true

jobs:
  engine_tests:
    name: Run time_tracking engine tests
    runs-on: ubuntu-latest

    env:
      FIZZY_IMAGE_TAG: ${{ inputs.fizzy_image_tag }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.ref }}

      - name: Set up Fizzy app
        uses: ./.github/actions/setup-fizzy-app
        with:
          fizzy_ref: ${{ inputs.fizzy_ref }}

      - name: Run time_tracking engine tests
        run: bundle exec rake test

  fizzy_tests:
    name: Run fizzy app tests
    runs-on: ubuntu-latest

    env:
      FIZZY_IMAGE_TAG: ${{ inputs.fizzy_image_tag }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.ref }}

      - name: Set up Fizzy app
        uses: ./.github/actions/setup-fizzy-app
        with:
          fizzy_ref: ${{ inputs.fizzy_ref }}

      - name: Run fizzy app tests
        run: bundle exec rake test:fizzy
