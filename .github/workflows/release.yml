name: Release

on:
  push:
    tags:
      - latest
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      fizzy_ref:
        description: "Fizzy git ref (overrides auto-detection)"
        default: ""
      force:
        description: "Force rebuild even if already built against this Fizzy image"
        type: boolean
        default: false

concurrency:
  group: latest
  cancel-in-progress: true

jobs:
  check:
    name: Check whether to build
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fizzy_ref: ${{ steps.resolve.outputs.fizzy_ref }}
      fizzy_image_tag: ${{ steps.resolve.outputs.fizzy_image_tag }}
    steps:
      - name: Resolve Fizzy image tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF="${{ inputs.fizzy_ref }}"

          if [ -n "$INPUT_REF" ]; then
            if [[ "$INPUT_REF" == fizzy@* ]]; then
              SHA="${INPUT_REF#fizzy@}"
              echo "fizzy_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=sha-$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "fizzy_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=$INPUT_REF" >> "$GITHUB_OUTPUT"
            fi
          else
            LATEST_TAG=$(gh api '/repos/basecamp/fizzy/releases?per_page=100' \
              --jq 'map(select((.tag_name | startswith("fizzy@")) and (.draft == false))) |
                    sort_by(.published_at) | last | .tag_name')

            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ]; then
              SHA="${LATEST_TAG#fizzy@}"
              echo "fizzy_ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=sha-$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No fizzy@ release found in Fizzy releases"
              echo "fizzy_ref=" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify latest git tag exists
        id: tag
        if: github.event_name != 'push'
        run: |
          if git ls-remote --tags https://github.com/${{ github.repository }} latest | grep -q latest; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No 'latest' git tag found — push one with: git tag -f latest HEAD && git push origin latest --force"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check cache for previous build
        if: github.event_name != 'push' && steps.resolve.outputs.fizzy_image_tag != '' && steps.tag.outputs.exists == 'true' && inputs.force != true && inputs.fizzy_ref == ''
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .latest-fizzy-built
          key: latest-fizzy-built-${{ steps.resolve.outputs.fizzy_image_tag }}

      - name: Decide whether to build
        id: decide
        run: |
          FIZZY_IMAGE_TAG="${{ steps.resolve.outputs.fizzy_image_tag }}"
          TAG_EXISTS="${{ steps.tag.outputs.exists }}"
          CACHE_HIT="${{ steps.cache.outputs.cache-hit }}"
          FORCE="${{ inputs.force }}"
          INPUT_REF="${{ inputs.fizzy_ref }}"
          EVENT="${{ github.event_name }}"

          if [ -z "$FIZZY_IMAGE_TAG" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: could not resolve Fizzy image tag"
          elif [ "$EVENT" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building: latest tag pushed"
          elif [ "$TAG_EXISTS" != "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no latest git tag"
          elif [ "$FORCE" = "true" ] || [ -n "$INPUT_REF" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building: force=$FORCE, explicit ref=$INPUT_REF"
          elif [ "$CACHE_HIT" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: already built against $FIZZY_IMAGE_TAG"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building: new Fizzy image $FIZZY_IMAGE_TAG"
          fi

          {
            echo "### Latest check"
            echo "- Trigger: \`$EVENT\`"
            echo "- Fizzy image tag: \`$FIZZY_IMAGE_TAG\`"
            echo "- Should build: \`$(grep should_build "$GITHUB_OUTPUT" | cut -d= -f2)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      engine_ref: latest
      fizzy_ref: ${{ needs.check.outputs.fizzy_ref }}
      fizzy_image_tag: ${{ needs.check.outputs.fizzy_image_tag }}
    secrets: inherit

  build_amd64:
    name: Build image (amd64)
    needs: [check, test]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest-amd64
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --build-arg FIZZY_IMAGE_TAG=${{ needs.check.outputs.fizzy_image_tag }} \
            -t $IMAGE \
            .

  build_arm64:
    name: Build image (arm64)
    needs: [check, test]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest-arm64
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --build-arg FIZZY_IMAGE_TAG=${{ needs.check.outputs.fizzy_image_tag }} \
            -t $IMAGE \
            .

  combine_images:
    name: Combine arch images
    needs: [check, build_amd64, build_arm64]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest
          docker buildx imagetools create \
            -t $IMAGE \
            ${IMAGE}-amd64 \
            ${IMAGE}-arm64

      - name: Summary
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest
          {
            echo "### Docker image pushed"
            echo '```'
            echo "docker pull $IMAGE"
            echo '```'
            echo "Fizzy base: \`ghcr.io/basecamp/fizzy:${{ needs.check.outputs.fizzy_image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  record:
    name: Cache base Fizzy version
    needs: [check, combine_images, release]
    runs-on: ubuntu-latest
    steps:
      - name: Record Fizzy image tag in cache
        run: |
          mkdir -p .latest-fizzy-built
          echo "${{ needs.check.outputs.fizzy_image_tag }}" > .latest-fizzy-built/tag
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .latest-fizzy-built
          key: latest-fizzy-built-${{ needs.check.outputs.fizzy_image_tag }}

  release:
    name: Create GitHub release
    needs: [check, combine_images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: latest
          fetch-depth: 1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ENGINE_SHA=$(git rev-parse --short HEAD)
          FIZZY_SHA="${{ needs.check.outputs.fizzy_image_tag }}"
          FIZZY_SHA="${FIZZY_SHA#sha-}"
          FIZZY_REF="${{ needs.check.outputs.fizzy_ref }}"
          IMAGE="ghcr.io/${{ github.repository }}:latest"

          RELEASE_TAG="fizzy-time_tracking@${ENGINE_SHA}+${FIZZY_SHA}"

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists, skipping"
            exit 0
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(gh api repos/${{ github.repository }}/git/tags \
            --method POST \
            -f tag="$RELEASE_TAG" \
            -f message="$RELEASE_TAG" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$TAG_SHA"

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --latest \
            --notes "$(cat <<EOF
          \`\`\`
          docker pull $IMAGE
          \`\`\`

          Built on Fizzy [\`$FIZZY_REF\`](https://github.com/basecamp/fizzy/releases/tag/$FIZZY_REF)
          EOF
          )"
