name: Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      fizzy_ref:
        description: "Fizzy git ref override (e.g., main to test against unreleased Fizzy)"
        default: ""

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve Fizzy version
    runs-on: ubuntu-latest
    outputs:
      fizzy_ref: ${{ steps.resolve.outputs.fizzy_ref }}
      fizzy_image_tag: ${{ steps.resolve.outputs.fizzy_image_tag }}
    steps:
      - name: Resolve Fizzy ref and image tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF="${{ inputs.fizzy_ref }}"

          if [ -n "$INPUT_REF" ]; then
            if [[ "$INPUT_REF" == fizzy@* ]]; then
              SHA="${INPUT_REF#fizzy@}"
              echo "fizzy_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=sha-$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "fizzy_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=$INPUT_REF" >> "$GITHUB_OUTPUT"
            fi
          else
            LATEST_TAG=$(gh api /repos/basecamp/fizzy/releases \
              --jq 'map(select(.tag_name | startswith("fizzy@"))) | .[0].tag_name')

            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ]; then
              SHA="${LATEST_TAG#fizzy@}"
              echo "fizzy_ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=sha-$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No fizzy@ release found, falling back to main"
              echo "fizzy_ref=main" >> "$GITHUB_OUTPUT"
              echo "fizzy_image_tag=main" >> "$GITHUB_OUTPUT"
            fi
          fi

          {
            echo "### Fizzy resolution"
            echo "- Git ref: \`$(grep fizzy_ref "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)\`"
            echo "- Image tag: \`$(grep fizzy_image_tag "$GITHUB_OUTPUT" | head -1 | cut -d= -f2)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: resolve
    uses: ./.github/workflows/_test.yml
    with:
      fizzy_ref: ${{ needs.resolve.outputs.fizzy_ref }}
      fizzy_image_tag: ${{ needs.resolve.outputs.fizzy_image_tag }}
    secrets: inherit
