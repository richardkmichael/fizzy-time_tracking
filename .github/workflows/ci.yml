name: CI

on:
  workflow_call:
    inputs:
      engine_ref:
        description: "Engine git ref to checkout (defaults to triggering ref)"
        type: string
      fizzy_ref:
        description: "Fizzy git ref for cloning during tests"
        type: string
        required: true
      fizzy_image_tag:
        description: "Docker image tag for the Fizzy base image"
        type: string
        required: true
      engine_image_tag:
        description: "Tag for the output Docker image — required when push_image is true (latest.yml passes 'latest')"
        type: string
      push_image:
        description: "Whether to push the built image to GHCR"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FIZZY_REF: ${{ inputs.fizzy_ref }}
      FIZZY_IMAGE_TAG: ${{ inputs.fizzy_image_tag }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick libopenslide-dev

      - name: Cache Fizzy bundle
        uses: actions/cache@v4
        with:
          path: test/fizzy/vendor/bundle
          key: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-${{ github.run_id }}
          restore-keys: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-

      - name: Set up Fizzy host app
        run: bundle exec rake dev:setup

      - name: Run engine tests
        run: bundle exec rake test

      - name: Run host tests
        run: bundle exec rake test:fizzy

  build:
    name: Build image (${{ matrix.arch }})
    needs: test
    if: inputs.push_image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.engine_image_tag }}-${{ matrix.arch }}
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --push \
            --build-arg FIZZY_IMAGE_TAG=${{ inputs.fizzy_image_tag }} \
            -t $IMAGE \
            .

  manifest:
    needs: build
    if: inputs.push_image
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.engine_image_tag }}
          docker buildx imagetools create \
            -t $IMAGE \
            ${IMAGE}-amd64 \
            ${IMAGE}-arm64

      - name: Summary
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.engine_image_tag }}
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Fizzy base: \`ghcr.io/basecamp/fizzy:${{ inputs.fizzy_image_tag }}\`" >> $GITHUB_STEP_SUMMARY
