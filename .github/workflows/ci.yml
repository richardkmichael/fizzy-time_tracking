name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      fizzy_ref:
        description: "Fizzy git ref (branch, tag, or SHA)"
        default: "main"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FIZZY_REF: ${{ inputs.fizzy_ref || 'main' }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick libopenslide-dev

      - name: Cache Fizzy bundle
        uses: actions/cache@v4
        with:
          path: test/fizzy/vendor/bundle
          key: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-${{ github.run_id }}
          restore-keys: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-

      - name: Set up Fizzy host app
        run: bundle exec rake setup

      - name: Run engine tests
        run: bundle exec rake test

      - name: Run host tests
        run: bundle exec rake test:fizzy

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          bundle exec rake build
          docker tag fizzy-time_tracking $IMAGE
          docker push $IMAGE
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
