name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      fizzy_ref:
        description: "Fizzy git ref (branch, tag, or SHA)"
        default: "main"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FIZZY_REF: ${{ inputs.fizzy_ref || 'main' }}

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Checkout Fizzy
        uses: actions/checkout@v4
        with:
          repository: basecamp/fizzy
          ref: ${{ env.FIZZY_REF }}
          path: fizzy

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: fizzy
          bundler-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick libopenslide-dev

      - name: Add engine to Fizzy Gemfile
        working-directory: fizzy
        run: |
          echo 'gem "fizzy-time_tracking", path: "../engine"' >> Gemfile

      - name: Bundle install
        working-directory: fizzy
        run: bundle install

      - name: Run install generator
        working-directory: fizzy
        run: bin/rails g fizzy_time_tracking:install

      - name: Prepare database
        working-directory: fizzy
        run: bin/rails db:prepare

      - name: Run engine tests
        working-directory: fizzy
        run: bin/rails test ../engine/test/

      - name: Run host tests
        working-directory: fizzy
        run: bin/rails test
