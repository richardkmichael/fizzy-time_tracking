name: CI

on:
  workflow_call:
    inputs:
      engine_ref:
        description: "Engine git ref to checkout (defaults to triggering ref)"
        type: string
      fizzy_ref:
        description: "Fizzy git ref for cloning during tests"
        type: string
        required: true
      fizzy_image_tag:
        description: "Docker image tag for the Fizzy base image"
        type: string
        required: true
      engine_image_tag:
        description: "Tag for the output Docker image — required when push_image is true (latest.yml passes 'latest')"
        type: string
      push_image:
        description: "Whether to push the built image to GHCR"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FIZZY_REF: ${{ inputs.fizzy_ref }}
      FIZZY_IMAGE_TAG: ${{ inputs.fizzy_image_tag }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick libopenslide-dev

      - name: Cache Fizzy bundle
        uses: actions/cache@v4
        with:
          path: test/fizzy/vendor/bundle
          key: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-${{ github.run_id }}
          restore-keys: fizzy-bundle-${{ runner.os }}-${{ env.FIZZY_REF }}-

      - name: Set up Fizzy host app
        run: bundle exec rake dev:setup

      - name: Run engine tests
        run: bundle exec rake test

      - name: Run host tests
        run: bundle exec rake test:fizzy

      - name: Log in to GHCR
        if: inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: inputs.push_image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.engine_image_tag }}
          bundle exec rake prod:build
          docker tag fizzy-time_tracking $IMAGE
          docker push $IMAGE
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Fizzy base: \`ghcr.io/basecamp/fizzy:$FIZZY_IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
