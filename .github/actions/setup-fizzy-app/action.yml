name: Set up Fizzy app
description: Install Ruby + system deps, cache bundles, clone Fizzy, migrate

inputs:
  fizzy_ref:
    description: "Fizzy git ref for cloning"
    required: true
  engine_path:
    description: "Path to the engine checkout (where Gemfile/Rakefile live)"
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true
        working-directory: ${{ inputs.engine_path }}

    - name: Install system dependencies
      shell: bash
      # Runners occasionally fall back from their local mirror to
      # archive.ubuntu.com, which can hang indefinitely without these.
      env:
        APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
      run: |
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS libvips-dev imagemagick libopenslide-dev

    - name: Cache Fizzy bundle
      uses: actions/cache@v4
      with:
        path: ${{ inputs.engine_path }}/test/fizzy/vendor/bundle
        key: fizzy-bundle-${{ runner.os }}-${{ inputs.fizzy_ref }}-${{ github.run_id }}
        restore-keys: fizzy-bundle-${{ runner.os }}-${{ inputs.fizzy_ref }}-

    - name: Clone Fizzy and prepare app
      shell: bash
      working-directory: ${{ inputs.engine_path }}
      env:
        FIZZY_REF: ${{ inputs.fizzy_ref }}
      run: bundle exec rake dev:setup
